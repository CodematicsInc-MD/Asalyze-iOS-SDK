name: asalyze
description: Apple Search Ads ROAS tracking for iOS Flutter apps — first-party AdServices attribution + StoreKit 2 revenue. No IDFA.
version: 3.1.9
homepage: https://asalyze.com
repository: https://github.com/CodematicsInc-MD/Asalyze-iOS-SDK
issue_tracker: https://github.com/CodematicsInc-MD/Asalyze-iOS-SDK/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # iOS only — Apple Search Ads attribution is an iOS capability. No Android implementation.
      ios:
        pluginClass: AsalyzePlugin
